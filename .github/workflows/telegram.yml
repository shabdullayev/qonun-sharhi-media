name: Telegram kanal

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "all = joylash; check = tekshirish; probe = manbalarni ko‘rish; sign = belgini qo‘shish; delete = bot xabarini o‘chirish"
        required: false
        default: all
        type: choice
        options: [all, check, probe, fetch, videos, news, sign, delete, backfill]
      message_id:
        description: "delete rejimi uchun xabar raqami"
        required: false
        default: ""
      urls:
        description: "fetch rejimi uchun sahifalar (vergul bilan)"
        required: false
        default: ""
      backfill:
        description: "backfill rejimi: Manba:soni, vergul bilan"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            queue
            scripts
          sparse-checkout-cone-mode: true
      - name: Telegram'ga joylash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'all' }}
          MESSAGE_ID: ${{ github.event.inputs.message_id }}
          FETCH_URLS: ${{ github.event.inputs.urls }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          SIGNATURE: "@huquq_ustuvor"
          # navbatdagi video 50 daqiqa ichida bo‘lsa, ish jarayoni uni vaqtida yuborish uchun kutib turadi
          LOOP_MINUTES: "50"
          # navbatdagi video 3 soat ichida bo‘lsa, keyingi ishga tushishni o‘zi chaqiradi (GitHub jadvali kechikadi)
          CHAIN_HOURS: "3"
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/tg_bot.py "$MODE"
