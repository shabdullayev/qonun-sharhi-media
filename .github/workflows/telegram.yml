name: Telegram kanal

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            queue
            scripts
          sparse-checkout-cone-mode: true
      - name: Telegram'ga joylash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/tg_bot.py all
      - name: Holatni saqlash
        run: |
          git config user.name "qonun-sharhi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue/telegram_queue.json queue/telegram_news_seen.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Telegram holati yangilandi [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
          fi
